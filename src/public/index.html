<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Citas y Servicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Sistema de Gestión de Citas</h1>
            <p class="text-gray-600">CUN - Calidad de Software</p>
            <p class="text-sm text-gray-500 mt-2">Santiago Sabogal y John Ardila</p>
        </header>

        <!-- Navigation -->
        <nav id="nav" class="mb-8 hidden">
            <div class="flex flex-wrap gap-2">
                <button onclick="navigate('login')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                    Login/Registro
                </button>
                <button onclick="navigate('servicios')" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">
                    Servicios
                </button>
                <button onclick="navigate('agendar')" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600 transition">
                    Agendar Cita
                </button>
                <button onclick="navigate('mis-citas')" class="px-4 py-2 bg-orange-500 text-white rounded hover:bg-orange-600 transition">
                    Mis Citas
                </button>
                <button onclick="navigate('admin-citas')" id="btn-admin-citas" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition hidden">
                    Panel Admin
                </button>
                <button onclick="logout()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 transition">
                    Cerrar Sesión
                </button>
            </div>
            <div id="user-info" class="mt-4 text-sm text-gray-600"></div>
        </nav>

        <!-- Login View -->
        <section id="login-view" class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-2xl font-semibold mb-4">Login / Registro</h2>
            <div class="space-y-4">
                <div>
                    <button onclick="showTab('login')" class="px-4 py-2 bg-blue-500 text-white rounded mr-2">Login</button>
                    <button onclick="showTab('register')" class="px-4 py-2 bg-green-500 text-white rounded">Registro</button>
                </div>
                
                <!-- Login Form -->
                <div id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="juan@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="********">
                    </div>
                    <button onclick="login()" class="w-full px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                        Iniciar Sesión
                    </button>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                        <input type="text" id="register-nombre" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Juan Pérez">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="register-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="juan@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" id="register-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="********">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono (opcional)</label>
                        <input type="tel" id="register-telefono" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="+57 300 123 4567">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección (opcional)</label>
                        <input type="text" id="register-direccion" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Calle 123, Bogotá">
                    </div>
                    <button onclick="register()" class="w-full px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
                        Registrarse
                    </button>
                </div>
            </div>
            <div id="auth-message" class="mt-4 text-sm"></div>
        </section>

        <!-- Servicios View -->
        <section id="servicios-view" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
            <h2 class="text-2xl font-semibold mb-4">Catálogo de Servicios</h2>
            <div id="servicios-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- Agendar Cita View -->
        <section id="agendar-view" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
            <h2 class="text-2xl font-semibold mb-4">Agendar Nueva Cita</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Servicio</label>
                    <select id="cita-servicio" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="">Seleccione un servicio</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha y Hora</label>
                    <input type="datetime-local" id="cita-fecha" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notas (opcional)</label>
                    <textarea id="cita-notas" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" rows="3" placeholder="Notas adicionales..."></textarea>
                </div>
                <button onclick="agendarCita()" class="w-full px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
                    Agendar Cita
                </button>
            </div>
            <div id="agendar-message" class="mt-4 text-sm"></div>
        </section>

        <!-- Mis Citas View -->
        <section id="mis-citas-view" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
            <h2 class="text-2xl font-semibold mb-4">Mis Citas</h2>
            <div id="mis-citas-list" class="space-y-4"></div>
        </section>

        <!-- Admin Citas View -->
        <section id="admin-citas-view" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
            <h2 class="text-2xl font-semibold mb-4">Panel de Administración - Citas</h2>
            <div id="admin-citas-list" class="space-y-4"></div>
        </section>
    </div>

    <script src="auth.js"></script>
    <script src="servicios.js"></script>
    <script src="citas.js"></script>
    <script src="app.js"></script>
</body>
</html>
